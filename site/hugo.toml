# 正式域名见 config/production/hugo.toml；Actions优先该值，元数据作无自定义域名时的回退。
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "个人博客"
theme = "stack"
enableRobotsTXT = true
copyright = ""

[outputs]
home = ["HTML", "RSS", "Discussions"]
[outputFormats.Discussions]
mediaType = "application/json"
baseName = "discussions"
isPlainText = true
notAlternative = true
[pagination]
pagerSize = 6
[permalinks]
post = "/post/:slug/"
notes = "/notes/:slug/"
discovery = "/discovery/:slug/"
project = "/project/:slug/"
page = "/:slug/"
[taxonomies]
category = "categories"
tag = "tags"
topic = "topics"
series = "series"
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["\\[", "\\]"], ["$$", "$$"]]
inline = [["\\(", "\\)"]]
[markup.highlight]
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3
[params]
mainSections = ["post", "notes", "discovery", "project"]
description = "记录生活、整理知识、分享兴趣与项目。"
apiBase = ""
favicon = ""
share_image = ""

[params.sidebar]
subtitle = ""
avatar = ""
[params.dateFormat]
published = "2006年01月02日"
lastUpdated = "2006年01月02日"
[params.footer]
since = 2026
customText = ""
[params.article]
math = true
toc = true
readingTime = true
[params.article.list]
showTags = true
[params.comments]
enabled = true
provider = "local"
[params.colorScheme]
toggle = true
default = "light"
[params.widgets]
homepage = [{type="search"}, {type="categories"}, {type="tag-cloud"}]
page = [{type="toc"}]
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[menu.main.params]
icon = "home"

[[menu.main]]
identifier = "essays"
name = "随笔"
url = "/essays/"
weight = 2

[menu.main.params]
icon = "archives"

[[menu.main]]
identifier = "learning"
name = "学习"
url = "/learning/"
weight = 3

[menu.main.params]
icon = "archives"

[[menu.main]]
identifier = "projects"
name = "项目"
url = "/projects/"
weight = 4

[menu.main.params]
icon = "link"

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 5

[menu.main.params]
icon = "user"
