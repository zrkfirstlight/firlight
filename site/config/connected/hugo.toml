# Enabled after real HTTPS API and CORS acceptance on 2026-10-25.
# Static reading remains independent; registration is controlled by backend health.
baseURL = "https://zrk123.cn/"
ignoreFiles = ['(^|[/\\])page[/\\](design-lab|design-preview)([/\\]|$)', '(^|[/\\])post[/\\]delivery-qa-draft([/\\]|$)']
[params]
apiBase = "https://api.zrk123.cn/api"
[params.comments]
enabled = true

[[module.mounts]]
source = "static"
target = "static"
files = ["! audio/ancient/**", "! images/music/**", "! images/landscape.svg", "! css/design-lab.css", "! css/design-preview.css", "! js/design-lab.js", "! js/design-preview.js"]
