# GitHub Pages release: static only. No browser API requests or account UI.
baseURL = "https://zrk123.cn/"
# Planned API: https://api.zrk123.cn/api ; not connected, keep public interaction disabled.
ignoreFiles = ['(^|[/\\])page[/\\](guestbook|account)([/\\]|$)']
[params]
apiBase = ""
[params.comments]
enabled = false

[[module.mounts]]
source = "static"
target = "static"
files = ["! js/community.js", "! js/community-api.js"]
