{{ .Page.Store.Set "lifeLab" true }}
<section class="life-lab" aria-label="生命游戏交互实验"><p class="life-instruction">初始为暂停。选择图案或点击网格，再单步观察。</p><div class="life-controls"><label>预设 <select data-life-preset><option value="glider">滑翔机</option><option value="blinker">闪烁条</option><option value="block">方块</option></select></label><button type="button" data-life-play>开始</button><button type="button" data-life-step>前进一步</button><button type="button" data-life-reset>重置图案</button><button type="button" data-life-clear>清空</button></div><canvas width="528" height="336" aria-label="有限网格，可点击切换格子状态"></canvas><p role="status" data-life-status>第0代 · 已暂停</p><small>点击网格会暂停并切换一个格子；系统减少动态效果时仍可手动单步，不会自动开始。</small></section>
