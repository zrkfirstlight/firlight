<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{ .Title }}</title><link rel="stylesheet" href="{{ "css/design-lab.css" | relURL }}"></head>
<body class="lab-shell"><header class="lab-header"><a href="{{ .Site.Home.RelPermalink }}">← 返回当前博客</a><span>独立设计画布 / 01—03</span><h1>布局实验，仅供预览</h1><p>同一组示例内容，三种空间组织。这里的切换不会改变正式网站。</p></header>
<main><section class="lab-controls" aria-label="预览设置"><div role="group" aria-label="布局方案"><button data-scheme="A" aria-pressed="true">A · 冷调编辑</button><button data-scheme="B" aria-pressed="false">B · 星空档案</button><button data-scheme="C" aria-pressed="false">C · 偏心轨道</button></div><div role="group" aria-label="画布宽度"><button data-width="desktop" aria-pressed="true">桌面</button><button data-width="narrow" aria-pressed="false">窄屏 · 390px</button></div><div role="group" aria-label="预览内容"><button data-view="home" aria-pressed="true">首页布局</button><button data-view="article" aria-pressed="false">文章阅读</button></div></section>
<p id="lab-note" aria-live="polite">主文占据视觉重心，侧栏与短记录错落排列；信息层次清楚，首页需要较多留白。</p>
<div class="lab-stage"><iframe id="lab-frame" src="{{ "design-preview/" | relURL }}" title="A 冷调编辑：首页预览" loading="eager"></iframe></div><p class="lab-footnote">窄屏模式改变 iframe 的真实视口宽度；窗口较小时桌面画布也会自然收窄。示例中的文章按钮可进入阅读区域，项目入口跳到项目摘要。没有“应用主题”操作。</p></main>
<script src="{{ "js/design-lab.js" | relURL }}" defer></script></body></html>
