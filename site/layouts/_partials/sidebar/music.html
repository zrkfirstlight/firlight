{{ if hugo.Data.experience.music.enabled }}
<section class="sidebar-music" id="music-player" aria-label="音乐播放器">
  <div class="music-record" aria-hidden="true"><img data-cover alt="" width="28" height="28" hidden></div>
  <a data-current class="sidebar-track" title="歌曲详情">音乐</a>
  <div class="music-transport">
    <button type="button" data-play aria-label="播放" title="播放"></button>
    <button type="button" data-next aria-label="下一首" title="下一首"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 10 7-10 7Z"/><path d="M18 5v14" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button type="button" data-mode aria-label="列表循环" title="列表循环"></button>
  </div>
  <p data-status class="music-sr-only" role="status" aria-live="polite">尚未播放</p>
  <div hidden>
    <span data-mini></span><span data-artist></span><button type="button" data-prev>上一首</button>
    <input type="range" data-seek min="0" max="100" value="0" step="0.1" disabled><output data-time></output>
    <input type="range" data-volume min="0" max="1" step="0.05" value="0.6"><button type="button" data-mute>静音</button>
    <ol data-playlist></ol>
  </div>
</section>
{{ end }}
